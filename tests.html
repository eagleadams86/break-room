<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<!-- frame-src 'self' is what lets the hidden iframe below load index.html.
     Without it the frame is refused by default-src and the suite reports that
     the app exposed no hooks — which reads as an app bug and is a CSP one. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'self'; frame-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Break Room — Tests</title>
<style>
  /* Dev-only page. Colours are Midnight from the theme pack, HARD-CODED on
     purpose: this page must keep working when theme.css is the thing that
     broke, so it is the one file here that does not link it. */
  body { background: #0a0e1a; color: #e7eaf6; margin: 0;
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #838cab; font-size: 12.5px; margin: 0 0 18px; }
  #summary { font-weight: 600; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px;
             border: 1px solid #262f4a; background: #121829; }
  #summary.ok  { color: #72fe84; border-color: #72fe84; }
  #summary.bad { color: #fb7874; border-color: #fb7874; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 6px 8px; border-bottom: 1px solid #262f4a; vertical-align: top; }
  td.st { width: 28px; font-weight: 700; }
  tr.pass td.st { color: #72fe84; }
  tr.fail td.st { color: #fb7874; }
  tr.fail td.msg { color: #fb7874; }
  .msg { color: #838cab; font-size: 12px; white-space: pre-wrap; }
  .group td { padding-top: 16px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
              text-transform: uppercase; color: #838cab; border-bottom-color: #374163; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Break Room — Tests</h1>
  <p class="sub">Loads the real index.html in a hidden iframe and calls its functions directly
    — no copies, no build step, so a test cannot drift from the code it tests. Read-only:
    nothing here writes to storage, and the cloud module never loads inside the frame.</p>
  <div id="summary">Loading…</div>
  <table><tbody id="out"></tbody></table>
</div>

<script>
'use strict';

/* ── The completeness floor ────────────────────────────────────────────────
   Every tests.html in this family pins the number of tests it expects to RUN.
   Removing a test fails the build; adding one never does. Without it, tests that
   go MISSING look exactly like tests that pass — a suite that quietly shrank to
   three checks still says "all 3 tests pass". RAISE THIS when you add tests, and
   lower it only when you retire one deliberately. */
const EXPECTED = 264;

/* ── It refuses to run anywhere but localhost, and that is load-bearing ──────
   GitHub Pages publishes this page BESIDE the app, where the iframe below would
   be the reader's real, saved copy — and booting the app IS the side effect, so
   the check cannot live in the load handler. `file://` is deliberately NOT in
   this list: it has no hostname, and treating '' as local sends the page down
   the iframe branch, where the frame silently fails to load and the suite blames
   the app for what is a setup problem. */
const LOCAL_HOSTS = ['localhost', '127.0.0.1', '[::1]'];

/* Bust the frame AND the source fetches. They are different caches and they can
   disagree: in the lottery repo this same harness once reported ALL GREEN
   against a page three features out of date, because the source-level tests read
   the file off the server while the frame ran a copy the browser had cached.
   Nothing errored; the new code was simply never run. A suite that can pass
   against a build which exists nowhere is worse than no suite — it turns
   "untested" into "verified". */
const BUST = '?t=' + Date.now();
const bustFetch = (path) => fetch(path + BUST, { cache: 'no-store' });

const TESTS = [];
function group(name) { TESTS.push({ group: name }); }
function t(name, fn) { TESTS.push({ name: name, fn: fn }); }
/* `detail` is the value that FAILED, not more prose: `ok(w <= pin, 'it fits',
   w + 'px')` says what was expected and then shows what was actually there.
   Every suite in the family takes three arguments now (2026-08-26). It was two
   here, and a call site passing a third had its diagnostic silently dropped —
   the assertion still failed correctly, it just refused to say what it saw.
   CodeQL's js/superfluous-trailing-arguments caught it three separate times in
   one day, in three different repos, which is what settled the signature. */
function ok(cond, note, detail) {
  if (cond) return;
  throw new Error((note || 'expected truthy')
    + (detail === undefined ? '' : ' \u2014 got ' + detail));
}
function eq(actual, expected, note) {
  const a = JSON.stringify(actual), b = JSON.stringify(expected);
  if (a !== b) throw new Error((note ? note + ' — ' : '') + 'got ' + a + ', wanted ' + b);
}
/* A loop, not a single .replace(): one pass over a multi-character delimiter can
   leave a NEW opener behind that the pass has already gone past. CodeQL flags the
   single-pass version and it was open on five of the nine public repos at once.
   Nothing here renders what it strips — the reason to fix it is that a helper
   which can be fooled about what is commented out is one that can miss a live
   off-origin script, which is what these suites exist to catch. */
/* The text a READER sees, tags removed. Deliberately a scanner and not
   `replace(/<[^>]+>/g, '')`: a single-pass tag strip is the shape CodeQL flags as
   incomplete multi-character sanitization, and it is right to — one pass over
   `<<p>p>` leaves a live tag behind. Nothing here is rendered, so the bug that
   shape would cause here is only a wrong CHARACTER COUNT, but the alert it raises
   is a real High sitting open on the security tab, where a true finding would be
   missed among it. Callers normalise whitespace themselves, as they did before. */
function visibleText(html) {
  let out = '', inTag = false;
  for (const ch of html) {
    if (ch === '<') { inTag = true; continue; }
    if (ch === '>') { inTag = false; continue; }
    if (!inTag) out += ch;
  }
  return out;
}

function stripComments(src) {
  let out = src, prev;
  do { prev = out; out = out.replace(/\/\*[\s\S]*?\*\//g, '').replace(/<!--[\s\S]*?-->/g, ''); }
  while (out !== prev);
  return out;
}

let W = null, H = null;
let APP_SRC = '', README_SRC = '', PRIVACY_SRC = '', THEME_SRC = '', SW_SRC = '', KILL_SRC = '', MANIFEST_SRC = '', RULES_SRC = '';

async function main() {
  if (LOCAL_HOSTS.indexOf(location.hostname) === -1) {
    const s = document.getElementById('summary');
    s.className = 'bad';
    s.textContent = 'This suite only runs on http://localhost — it boots the real app in a '
      + 'frame, which must never happen on the published site. Serve this folder and open '
      + 'http://localhost:<port>/tests.html';
    return;
  }

  APP_SRC      = await (await bustFetch('index.html')).text();
  PRIVACY_SRC  = await (await bustFetch('privacy.html')).text();
  THEME_SRC    = await (await bustFetch('theme.css')).text();
  SW_SRC       = await (await bustFetch('sw.js')).text();
  KILL_SRC     = await (await bustFetch('sw-kill.js')).text();
  MANIFEST_SRC = await (await bustFetch('manifest.webmanifest')).text();
  RULES_SRC    = await (await bustFetch('firestore.rules')).text();
  README_SRC   = await (await bustFetch('README.md')).text();

  /* ── Guard the source actually loaded, BEFORE any negative assertion ───────
     An all-NOT test over a fetched file proves nothing when the fetch failed:
     every "must not contain" passes on an empty string, and the suite goes green
     having read nothing. */
  ok(APP_SRC.length > 2000, 'index.html did not load — every check below would pass on an empty string');
  ok(PRIVACY_SRC.length > 500, 'privacy.html did not load');
  ok(THEME_SRC.length > 2000, 'theme.css did not load — is it beside these files?');
  ok(SW_SRC.length > 500, 'sw.js did not load');
  ok(KILL_SRC.length > 100, 'sw-kill.js did not load — the escape hatch has to exist BEFORE it is needed');
  ok(MANIFEST_SRC.length > 100, 'manifest.webmanifest did not load');
  ok(RULES_SRC.length > 2000, 'firestore.rules did not load — the caps below are checked against it');

  W = await bootApp();
  H = W.__brTestHooks;
  define();
  await runAsync();
  await run();
}

function bootApp() {
  return new Promise((resolve, reject) => {
    const frame = document.createElement('iframe');
    frame.title = 'app under test';
    frame.setAttribute('aria-hidden', 'true');
    frame.setAttribute('data-br-tests', '');
    frame.style.cssText = 'position:absolute;width:1000px;height:800px;left:-9999px;top:0';
    frame.addEventListener('load', () => {
      const win = frame.contentWindow;
      /* Wrapped: reading a property of a frame the CSP refused throws a
         SecurityError, and an uncaught one here never reaches the catch below —
         the suite then sits on "Loading…" saying nothing at all. */
      let hooks = null;
      try { hooks = win && win.__brTestHooks; } catch (e) { hooks = null; }
      if (hooks) { resolve(win); return; }
      let booted = false, blocked = false;
      try { booted = !!(win.document && win.document.getElementById('homeCard')); }
      catch (e) { blocked = true; }
      reject(new Error(blocked
        ? 'the frame could not be read at all — this page’s CSP needs frame-src \'self\'.'
        : booted
          ? 'index.html loaded but exposed no __brTestHooks — did something throw while '
            + 'it was starting up? Check the browser console.'
          : 'The hidden frame never loaded index.html — is it being served?'));
    }, { once: true });
    frame.src = 'index.html' + BUST;   /* set before append: one load event, the real one */
    document.body.appendChild(frame);
  });
}

/* The two async checks are run up front and their VERDICTS recorded, so a test
   body stays a plain function that either throws or doesn't. */
const asyncResults = {};
async function runAsync() {
  /* ── The render smoke test ────────────────────────────────────────────────
     Everything else in this suite calls a pure function or reads the source as
     text. That leaves the render layer never executed at all, and a throw
     inside a view would ship green. So this walks the app the way a person
     does: the home card, then a planted room through every phase it has, then
     every dialog opened and closed, recording anything the frame throws. It
     cannot tell a right figure from a wrong one; it is the difference between
     "the maths is right" and "the app runs". */
  try {
    const errs = [];
    W.addEventListener('error', (e) => errs.push(String(e.message)));
    W.addEventListener('unhandledrejection', (e) => errs.push('unhandled rejection: ' + e.reason));
    const drawn = {};
    const doc = W.document;
    H.__plantRoom(null);
    H.__plantLocal(FIXTURE_LOCAL);
    drawn['view:home'] = doc.getElementById('homeCard').textContent.trim().length;
    /* A room, through every phase it has, with the suite's own fixture. */
    H.__setMe(U.host);
    H.__plantRoom(fixtureRoom());
    H.__plantPlayers(fixturePlayers());
    drawn['view:lobby'] = doc.getElementById('roomView').textContent.trim().length;
    H.__setMe(U.b);
    drawn['view:lobby-as-player'] = doc.getElementById('roomView').textContent.trim().length;
    H.__plantRoom(fixtureRoom({ phase: 'results', kind: 'trivia', scores: { [U.b]: 150 } }));
    drawn['view:results'] = doc.getElementById('roomView').textContent.trim().length;
    H.__plantRoom(fixtureRoom({ phase: 'play', kind: 'poker' }));
    drawn['view:unknown-game'] = doc.getElementById('roomView').textContent.trim().length;
    H.__setMe(U.b);
    H.__plantRoom(fixtureRoom({ phase: 'play', kind: 'trivia', game: { step: 'ask', stepAt: T0, stepMs: 20000, round: 1, qi: 0, order: [3, 1, 2], n: 3, secs: 20, packId: 'general' } }));
    drawn['view:play'] = doc.getElementById('roomView').textContent.trim().length;
    H.__plantRoom(fixtureRoom({ phase: 'play', kind: 'trivia', game: { step: 'reveal', stepAt: T0, stepMs: 5000, round: 1, qi: 0, order: [3, 1, 2], n: 3, secs: 20, packId: 'general', correct: 3, counts: [1, 0, 0, 2], gained: { [U.b]: 150 } } }));
    drawn['view:reveal'] = doc.getElementById('roomView').textContent.trim().length;
    H.__plantRoom(fixtureRoom({ phase: 'play', kind: 'trivia', game: { step: 'ask', stepAt: T0, stepMs: 20000, round: 1, qi: 0, order: [0], n: 1, secs: 20, packId: 'nope' } }));
    drawn['view:missing-pack'] = doc.getElementById('roomView').textContent.trim().length;
    ['whoSaid', 'twoTruths', 'prompt'].forEach((mode) => {
      H.__plantRoom(fixtureRoom({ phase: 'play', kind: 'ice', game: { step: 'write', stepAt: T0, stepMs: 75000, round: 1, mode: mode, prompts: [0], n: 1, spies: [U.host] } }));
      drawn['view:ice-write-' + mode] = doc.getElementById('roomView').textContent.trim().length;
    });
    H.__setMe(null);
    H.__plantRoom(null);
    const dialogs = [...doc.querySelectorAll('dialog')].filter((d) => d.id);
    for (const d of dialogs) {
      try { d.showModal(); drawn['dialog:' + d.id] = d.textContent.trim().length; d.close(); }
      catch (e) { errs.push('dialog ' + d.id + ': ' + e.message); }
    }
    asyncResults.smoke = { errs: errs, drawn: drawn, dialogs: dialogs.length };
  } catch (e) { asyncResults.smoke = { errs: ['the walk itself threw: ' + e.message], drawn: {}, dialogs: 0 }; }
  try { H.__plantRoom(null); H.__plantLocal(FIXTURE_LOCAL); } catch (e) { /* reported by the walk's own verdict */ }
}

/* ── The suite plants what it needs, and never trusts what it finds ──────────
   A fixed local record and a fixed room, so a test asserting an order cannot
   drift with the reader's own browser. Uids are 28 alphanumerics, the shape
   Firebase mints, so the fixtures exercise the real ID_RE path. */
const U = { host: 'HOSTaaaaaaaaaaaaaaaaaaaaaaaa', b: 'BBBBbbbbbbbbbbbbbbbbbbbbbbbb',
            c: 'CCCCcccccccccccccccccccccccc', d: 'DDDDdddddddddddddddddddddddd' };
const FIXTURE_LOCAL = { version: 1, nick: 'Ada', code: '', packs: [], recent: [{ code: 'ABCDEF', at: 1 }] };
const T0 = 1800000000000;   /* a fixed "now", so every clock in the fixtures is relative to it */
function fixtureRoom(over) {
  return Object.assign({
    host: U.host, rev: 3, schema: 1, createdAt: T0 - 60000, expiresAt: T0 + 5 * 3600000,
    phase: 'lobby', kind: null, game: {}, scores: {}, feed: [], pack: null,
  }, over || {});
}
function fixturePlayers() {
  return [
    { uid: U.host, nick: 'Ada', joinedAt: T0 - 60000, seenAt: T0 - 1000, ansR: 0, hue: 0 },
    { uid: U.b, nick: 'Ben', joinedAt: T0 - 50000, seenAt: T0 - 2000, ansR: 0, hue: 1 },
    { uid: U.c, nick: 'Cat', joinedAt: T0 - 40000, seenAt: T0 - 10 * 60000, ansR: 0, hue: 2 },
  ];
}

function define() {
  const booted = !!W.document.getElementById('homeCard') && !W.document.getElementById('homeCard').hidden;
  H.__plantLocal(FIXTURE_LOCAL);

  group('the suite plants its own data');
  t('the app is rendered from a FIXTURE, not from this browser’s saved copy', () => {
    ok(booted, 'the app booted onto the home card with no room');
    eq(H.__local().nick, 'Ada', 'and the suite then planted its own local record');
    eq(H.__local().recent.length, 1, 'with one recent code');
    ok(!W.document.querySelector('#recentWrap [data-rejoin="ABCDEF"]'), 'a code the cloud has not called open is not shown');
    H.__plantRecentOpen({ ABCDEF: true });
    ok(W.document.querySelector('#recentWrap [data-rejoin="ABCDEF"]'), 'so once it has, there is a recent-room button to read');
    /* The promise this suite makes about the reader's own data — read off the
       app's source, not asserted against nothing. */
    const hook = (stripComments(APP_SRC).match(/__plantLocal: function[^\n]*/) || [''])[0];
    ok(hook, 'the plant hook must exist');
    ok(hook.indexOf('save()') === -1, 'plant must never write — this suite runs against the reader’s own copy');
  });
  t('the cloud module never loads inside the harness', () => {
    ok(W.frameElement && W.frameElement.hasAttribute('data-br-tests'), 'the frame carries the harness mark');
    eq(!!(W.brCloud && W.brCloud.on), false, 'and the module reports no cloud in it');
    const mod = (APP_SRC.match(/<script type="module">([\s\S]*?)<\/script>/) || [])[1] || '';
    ok(mod, 'the module exists');
    ok(!/<script[^>]+src="https?:/.test(APP_SRC), 'the SDK is never a <script src> — only a dynamic import() behind the harness guard');
  });

  /* ═══════════════════════════════════════════════════════════════════════
     THE FAMILY RULES. Each pins something that went wrong in this family at
     least once. They cost nothing and they are the only thing that notices
     when a page stops following the pack it links.
     ═══════════════════════════════════════════════════════════════════════ */

  group('the palette and type come from the pack, not from this page');
  t('no raw pixel font size anywhere in the app', () => {
    /* ONE exemption, removed by name: the newer-data card is built in script and
       has to render when theme.css is the thing that failed to load. */
    const body = stripComments(APP_SRC).replace(/font:16px\/1\.55 system-ui[^']*/g, '');
    const hits = (body.match(/font-size\s*:\s*[0-9.]+px/g) || [])
      .concat(body.match(/font:\s*[0-9.]+px/g) || []);
    eq(hits, [], 'raw pixel sizes opt that text out of the reader’s own text-size setting');
  });
  t('no font stack of its own — --font-sans is the pack’s', () => {
    const body = stripComments(APP_SRC).replace(/font:16px\/1\.55 system-ui,[^']*/g, '');
    ok(!/-apple-system/.test(body), 'the family stack lives in --font-sans; a local copy drifts');
    ok(/var\(--font-sans\)/.test(APP_SRC), 'and the body shorthand must use it');
    ok(/var\(--font-mono\)/.test(APP_SRC), 'and the room code reads in the pack’s mono face');
  });
  t('no literal colour inside the <style> block', () => {
    const css = (stripComments(APP_SRC).match(/<style>([\s\S]*?)<\/style>/) || [])[1] || '';
    ok(css.length > 500, 'the style block was not found, so this check read nothing');
    eq(css.match(/#[0-9a-f]{3,8}\b/gi) || [], [],
       'a colour is decided in the pack’s tokens.json or it is not decided');
  });
  t('and outside it, only the literals that must survive a missing theme.css', () => {
    const outside = stripComments(APP_SRC).replace(/<style>[\s\S]*?<\/style>/, '');
    const found = [...new Set((outside.match(/#[0-9a-f]{6}\b/gi) || []).map(h => h.toLowerCase()))];
    const allowed = ['#0a0e1a', '#121829', '#262f4a', '#aab2d0', '#e7eaf6', '#ebebe8',
                     '#818cf8', '#a5b4fc', '#141c33'];
    eq(found.filter(h => allowed.indexOf(h) === -1), [], 'unexpected literal colour(s)');
    const el = W.document.documentElement, was = el.getAttribute('data-theme');
    try {
      el.setAttribute('data-theme', 'midnight');
      eq(W.getComputedStyle(el).getPropertyValue('--bg').trim(), '#0a0e1a',
         'the theme-color meta and the halt card use Midnight’s --bg');
      el.setAttribute('data-theme', 'light');
      eq(W.getComputedStyle(el).getPropertyValue('--bg').trim(), '#ebebe8',
         'and the boot script uses Light’s');
    } finally { el.setAttribute('data-theme', was || 'auto'); }
  });
  t('the pack is LINKED, never inlined', () => {
    ok(/<link[^>]+href="theme\.css"/.test(APP_SRC), 'index.html must link theme.css');
    ok(/<link[^>]+href="theme\.css"/.test(PRIVACY_SRC), 'privacy.html must link it too');
    ok(!/--text-primary:\s*#/.test(stripComments(APP_SRC)),
       'an inlined copy is drift with a delay fuse — a pack change misses it silently');
  });
  t('a disabled button looks disabled — pack rule 20 reaches this page’s buttons', () => {
    const b = W.document.getElementById('createBtn');
    ok(b, 'the home card’s primary button exists');
    const was = b.disabled;
    try {
      b.disabled = false;
      eq(W.getComputedStyle(b).opacity, '1', 'an enabled primary is at full strength');
      b.disabled = true;
      const cs = W.getComputedStyle(b);
      eq(cs.opacity, '0.45', 'a disabled one is dimmed');
      eq(cs.cursor, 'not-allowed', 'and says so under the pointer');
    } finally { b.disabled = was; }
    ok(/button:disabled \{ opacity: \.45; cursor: not-allowed; \}/.test(THEME_SRC || ''),
       'the rule comes from theme.css, not from a copy in this page');
  });
  t('privacy.html carries style-src ‘self’, or the link is silently blocked', () => {
    const csp = (PRIVACY_SRC.match(/Content-Security-Policy" content="([^"]*)"/) || [])[1] || '';
    ok(/style-src[^;]*'self'/.test(csp), 'without it the stylesheet is refused and the page renders bare');
  });
  t('the avatars and the online dot are the pack’s tokens, never an invented colour', () => {
    /* Pack rule 4 for the avatars (the categorical ramp, in order) and the
       red-green rule for the dot: away is --text-muted, an absence, never red. */
    const css = (stripComments(APP_SRC).match(/<style>([\s\S]*?)<\/style>/) || [])[1] || '';
    ['--series-1', '--series-2', '--series-3', '--series-4', '--series-5'].forEach((tok) =>
      ok(css.indexOf('var(' + tok + ')') > -1, 'an avatar hue reads ' + tok));
    const dot = (css.match(/\.dot\s*\{([^}]*)\}/) || [])[1] || '';
    const on = (css.match(/\.dot\.on\s*\{([^}]*)\}/) || [])[1] || '';
    ok(/var\(--text-muted\)/.test(dot), 'away is muted');
    ok(/var\(--ok\)/.test(on), 'online is --ok');
    ok(!/--err/.test(dot) && !/--err/.test(on), 'and neither is red — Charles is red-green colourblind');
    const el = W.document.documentElement;
    ['--series-1', '--series-5', '--ok'].forEach(tok =>
      ok(/^#[0-9a-f]{6}$/i.test(W.getComputedStyle(el).getPropertyValue(tok).trim()),
         tok + ' did not resolve to a real colour'));
  });

  group('auto is the default, in all three places');
  t('the markup carries it, for a browser with no script', () => {
    ok(/<html[^>]*\sdata-theme="auto"/.test(APP_SRC), 'index.html');
    ok(/<html[^>]*\sdata-theme="auto"/.test(PRIVACY_SRC), 'privacy.html');
  });
  t('the boot script falls back to it, for a retired or missing saved id', () => {
    const boot = stripComments(APP_SRC).match(/valid\.indexOf\(t\) === -1\) t = '([a-z]+)'/);
    ok(boot, 'the boot script no longer normalises an unknown id');
    eq(boot[1], 'auto', 'nothing saved, or a retired id, must land on the default');
  });
  t('the picker pre-selects it, so the row never names another theme', () => {
    ok(/<option value="auto" selected>/.test(APP_SRC), 'auto must carry `selected`');
    eq((APP_SRC.match(/<option value="(?:auto|midnight|dark|light|sepia)" selected>/g) || []).length, 1,
       'exactly one option may carry it');
  });
  t('slate is the ONE id that maps to a palette rather than to the default', () => {
    ok(/t === 'slate'\) t = 'dark'/.test(stripComments(APP_SRC)),
       'slate is Dark renamed — sending it to Auto would change what a reader sees');
  });
  t('the themes are listed alphabetically', () => {
    const opts = (APP_SRC.match(/<option value="(auto|midnight|dark|light|sepia)"/g) || [])
      .map(o => (o.match(/value="([^"]+)"/) || [])[1]);
    eq(opts, ['auto', 'dark', 'light', 'midnight', 'sepia'],
       'Auto is first because of the alphabet, not because it is the default');
  });
  t('and it resolves live, in whichever mode this browser is in', () => {
    const el = W.document.documentElement, was = el.getAttribute('data-theme');
    try {
      const read = (th) => { el.setAttribute('data-theme', th);
        const c = W.getComputedStyle(el);
        return { bg: c.getPropertyValue('--bg').trim(), scheme: c.colorScheme.trim() }; };
      const auto = read('auto');
      const want = read(W.matchMedia('(prefers-color-scheme: dark)').matches ? 'midnight' : 'light');
      eq(auto.bg, want.bg, 'the pack resolves Auto’s palette');
      eq(auto.scheme, want.scheme, 'and color-scheme has to follow it');
    } finally { el.setAttribute('data-theme', was || 'auto'); }
  });

    ok(/if \(cur\.host !== user\.uid && !\(patch\.host === user\.uid\)\) throw/.test(mod), 'and refuses if the seat is not mine');
    ok(/tx\.update\(roomRef\(code\), Object\.assign\(forCloud\(patch\), \{ rev: rev \}\)\)/.test(mod), 'and writes rev + 1');
    ok(/if \(s\.metadata\.hasPendingWrites\) return;/.test(mod), 'a local echo is never adopted as the room');
    ok(/\(k === 'stepAt' \|\| k === 'pausedAt'\) && v === 'now'\) out\[k\] = F\.serverTimestamp\(\)/.test(mod), 'stepAt — and a pause — are the server’s clock, never the host’s');

  group('trivia: the engine is a pure step()');
  const TRIV = H.GAMES.trivia;
  const triviaRoom = (game, scores) => fixtureRoom({ phase: 'play', kind: 'trivia', scores: scores || {},
    game: Object.assign({ step: 'ask', stepAt: T0, stepMs: 20000, round: 1, qi: 0, order: [0, 1, 2], n: 3, secs: 20, packId: 'general', correct: null, counts: null, gained: null }, game || {}) });
  const Q0 = H.PACKS[0].qs[0], Q1 = H.PACKS[0].qs[1];
  const ctx = (answers, t) => ({ answers: answers, players: fixturePlayers(), now: t });
  t('an open question waits until everyone online has answered, or time is up', () => {
    const r = H.normalizeRoom(triviaRoom());
    eq(TRIV.step(r, ctx([], T0 + 1000)), null, 'nobody has answered and there is time');
    eq(TRIV.step(r, ctx([{ uid: U.host, r: 1, v: Q0.c, at: T0 + 5000 }], T0 + 6000)), null, 'Ada has, Ben (online) has not');
    ok(TRIV.step(r, ctx([{ uid: U.host, r: 1, v: Q0.c, at: T0 + 5000 }, { uid: U.b, r: 1, v: 0, at: T0 + 7000 }], T0 + 8000)),
       'both online players in: the reveal comes at once — Cat, away, is not waited for');
    ok(TRIV.step(r, ctx([], T0 + 20000)), 'and with nobody answering, time up is enough');
  });
  t('the reveal carries the correct index, the spread and what each player gained', () => {
    const r = H.normalizeRoom(triviaRoom());
    const wrong = (Q0.c + 1) % 4;
    const patch = TRIV.step(r, ctx([
      { uid: U.host, r: 1, v: Q0.c, at: T0 + 5000 },   /* right, with 15 s of 20 left: 100 + 75 */
      { uid: U.b, r: 1, v: wrong, at: T0 + 2000 },      /* wrong, fast: nothing */
      { uid: U.c, r: 1, v: Q0.c, at: T0 + 19000 },      /* right, late: 100 + 5 */
      { uid: U.d, r: 1, v: Q0.c, at: T0 + 1000 },       /* a late joiner with no score yet: 100 + 95 from 0 */
    ], T0 + 20000));
    eq(patch.game.step, 'reveal');
    eq(patch.game.stepAt, 'now', 'the reveal’s clock is the server’s');
    eq(patch.game.stepMs, H.REVEAL_MS);
    eq(patch.game.correct, Q0.c);
    const counts = [0, 0, 0, 0]; counts[Q0.c] = 3; counts[wrong] = 1;
    eq(patch.game.counts, counts, 'three right, one wrong');
    eq(patch.game.gained, { [U.host]: 175, [U.c]: 105, [U.d]: 195 }, '100 plus floor(100 × remaining / 20 s)');
    eq(patch.scores, { [U.host]: 175, [U.c]: 105, [U.d]: 195 }, 'added to a scoreboard that had nothing');
    ok(!(U.b in patch.scores), 'a wrong answer scores nothing and is not even a key');
  });
  t('an answer for another round is ignored, and points add to what was there', () => {
    const r = H.normalizeRoom(triviaRoom({ round: 2, qi: 1 }, { [U.host]: 300 }));
    const patch = TRIV.step(r, ctx([
      { uid: U.host, r: 2, v: Q1.c, at: T0 + 10000 },
      { uid: U.b, r: 1, v: Q1.c, at: T0 + 1000 },        /* last round's answer, still sitting there */
    ], T0 + 20000));
    eq(patch.game.counts.reduce((a, b) => a + b, 0), 1, 'only the live answer is counted');

  const ICE = H.GAMES.ice;

  const icePlayers = drawPlayers;

  const ictx = (answers, t, key, who) => ({ answers: answers, players: icePlayers(), now: t, me: who === undefined ? U.host : who, key: key || null });
  const wrote = (uid, v, r) => ({ uid: uid, r: r === undefined ? 1 : r, v: v, at: T0 + 1000 });
  /* A dealt who-said-it prompt: Ben wrote card 0, Dee card 1, Ada card 2. */

  const dealt = (over) => iceRoom(Object.assign({ step: 'guess', stepMs: 15000, round: 2, nonce: NONCE,
    cards: [{ t: 'Juggling' }, { t: 'Karaoke' }, { t: 'Origami' }], authors: [U.host, U.b, U.d] }, over || {}));

  group('icebreakers: the engine is a pure step()');

/* ── EVERY TEST IS AWAITED (2026-09-14) ─────────────────────────────────────
   This loop used to call `item.fn()` and move on. A plain test either throws or
   doesn't, so that was fine for them — but an `async` test returns a promise
   the moment it reaches its first `await`, the loop saw no throw and wrote ✓,
   and the assertions after the `await` ran later against a row already marked
   green. Their failures went nowhere at all: a rejected promise nobody holds.
   The gate test "a loaded page never holds the gate…" was written that way and
   could never fail. Now the loop awaits whatever a test returns — `await` on a
   plain function's `undefined` costs nothing — so an async test is as honest as
   a plain one and can be written in the ordinary way.
   Raced against a timeout, because an awaited test that never settles (a frame
   whose `load` never comes) would otherwise leave the page on "Loading…" for
   ever, which CI reads as a hang rather than a named failure. */
const TEST_TIMEOUT_MS = 20000;
async function run() {
  const out = document.getElementById('out');
  let pass = 0, fail = 0;
  for (const item of TESTS) {
    if (item.group) {
      const tr = document.createElement('tr');
      tr.className = 'group';
      const td = document.createElement('td');
      td.colSpan = 3; td.textContent = item.group;
      tr.appendChild(td); out.appendChild(tr);
      continue;
    }
    let err = null, timer = null;
    try {
      await Promise.race([
        Promise.resolve().then(() => item.fn()),
        new Promise((resolve, reject) => {
          timer = setTimeout(() => reject(new Error('the test never finished — gave up after '
            + TEST_TIMEOUT_MS / 1000 + 's')), TEST_TIMEOUT_MS);
        }),
      ]);
    } catch (e) { err = e; } finally { clearTimeout(timer); }
    const tr = document.createElement('tr');
    tr.className = err ? 'fail' : 'pass';
    const st = document.createElement('td');
    st.className = 'st'; st.textContent = err ? '✕' : '✓';
    const name = document.createElement('td'); name.textContent = item.name;
    const msg = document.createElement('td');
    msg.className = 'msg'; msg.textContent = err ? err.message : '';
    tr.appendChild(st); tr.appendChild(name); tr.appendChild(msg);
    out.appendChild(tr);
    if (err) fail++; else pass++;
  }
  /* The floor — see EXPECTED at the top. Written as a row of its own so it reads
     like any other failure, and counted into `fail` so CI's "All N tests pass"
     check cannot match. */
  if (pass + fail < EXPECTED) {
    const tr = document.createElement('tr');
    tr.className = 'fail';
    const st = document.createElement('td'); st.className = 'st'; st.textContent = '✕';
    const name = document.createElement('td');
    name.textContent = 'the suite ran only ' + (pass + fail) + ' of at least ' + EXPECTED + ' tests';
    const msg = document.createElement('td'); msg.className = 'msg';
    msg.textContent = 'tests have gone missing rather than failed, so a green result here would '
      + 'cover a fraction of the suite. If they were retired on purpose, lower EXPECTED to match.';
    tr.appendChild(st); tr.appendChild(name); tr.appendChild(msg);
    out.appendChild(tr);
    fail++;
  }
  const s = document.getElementById('summary');
  s.textContent = fail === 0 ? 'All ' + pass + ' tests pass' : fail + ' of ' + (pass + fail) + ' tests FAILED';
  s.className = fail === 0 ? 'ok' : 'bad';
  document.title = (fail === 0 ? '✓ ' : '✕ ') + document.title;
}

main().catch((e) => {
  const s = document.getElementById('summary');
  s.className = 'bad';
  s.textContent = 'The suite could not start: ' + e.message;
});
</script>
</body>
</html>
